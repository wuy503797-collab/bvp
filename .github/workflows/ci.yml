name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  range-environment:
    name: Python 3.11 / ${{ matrix.os }} / ranged dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0

      - name: Install ranged development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run deterministic CI validation
        run: python scripts/run_ci_validation.py

      - name: Confirm validation left a clean checkout
        run: python scripts/check_repository_hygiene.py --require-clean-working-tree

  reference-environment:
    name: Python 3.11 / Ubuntu / exact direct reference versions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0

      - name: Install exact direct reference versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run deterministic CI validation
        run: python scripts/run_ci_validation.py

      - name: Confirm validation left a clean checkout
        run: python scripts/check_repository_hygiene.py --require-clean-working-tree
